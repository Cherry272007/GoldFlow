services:
  - type: web
    name: goldflow-web
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build
    startCommand: gunicorn backend.app:app --workers 1 --threads 1
    envVars:
      - key: GOLDFLOW_API_KEY
        sync: false
      - key: GOLDFLOW_DB
        value: /tmp/goldflow.db
      - key: OPENROUTER_MODEL
        value: minimax/minimax-m3:free
      - key: MT5_SYMBOL
        value: XAUUSD
    # Set these as SECRETS in the Render dashboard (never commit their values):
    #   LSE_API_KEY, OPENROUTER_API_KEY, GOLDFLOW_API_KEY
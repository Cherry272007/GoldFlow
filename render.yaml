services:
  - type: web
    name: goldflow-web
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build
    startCommand: gunicorn backend.app:app --workers 1 --threads 1
    envVars:
      - key: GOLDFLOW_API_KEY
        sync: false
      # VITE_GOLDFLOW_API_KEY is consumed by the frontend build and baked into
      # the JS bundle. Set it to the SAME value as GOLDFLOW_API_KEY so the
      # dashboard can call the protected /api/analyze endpoint.
      - key: VITE_GOLDFLOW_API_KEY
        sync: false
      - key: GOLDFLOW_DB
        value: /tmp/goldflow.db
      - key: OPENROUTER_MODEL
        value: minimax/minimax-m3:free
      - key: MT5_SYMBOL
        value: XAUUSD
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:goldflow@example.com
    # Set these as SECRETS in the Render dashboard (never commit their values):
    #   LSE_API_KEY, OPENROUTER_API_KEY, GOLDFLOW_API_KEY (= VITE_GOLDFLOW_API_KEY),
    #   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY